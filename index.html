    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'DM Sans',sans-serif;background:#0b0f19;color:#e2e8f0;overflow-x:hidden}
        ::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:#141b2d}::-webkit-scrollbar-thumb{background:#2a3a52;border-radius:3px}

        .glass{background:rgba(20,27,45,0.85);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.05)}

        @keyframes ticker-up{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}

        .btn-primary:hover{transform:scale(1.03);box-shadow:0 4px 20px rgba(0,230,118,.4)}.btn-primary:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}

        .btn-secondary:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2)}
        .btn-danger{background:linear-gradient(135deg,#ff1744,#d50000);color:#fff;font-weight:700;border:none;padding:10px 24px;border-radius:10px;cursor:pointer;transition:all .2s}
        .btn-danger:hover{box-shadow:0 4px 20px rgba(255,23,68,.4)}

        .btn-gold:hover{box-shadow:0 4px 20px rgba(255,215,0,.4)}
        .btn-approve{background:linear-gradient(135deg,#00e676,#00b35c);color:#0b0f19;font-weight:700;border:none;padding:6px 16px;border-radius:8px;cursor:pointer;font-size:.8rem}
        .btn-reject{background:linear-gradient(135deg,#ff1744,#d50000);color:#fff;font-weight:700;border:none;padding:6px 16px;border-radius:8px;cursor:pointer;font-size:.8rem}
        .input-field{background:#0f1523;border:1px solid #2a3a52;color:#e2e8f0;padding:10px 16px;border-radius:10px;outline:none;width:100%;font-size:.95rem;transition:border-color .2s}

        .admin-table th{background:#1a2332;padding:12px 16px;text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:#94a3b8;border-bottom:1px solid #2a3a52}
        .admin-table td{padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.03);font-size:.85rem}
        .admin-table tr:hover td{background:rgba(0,230,118,.02)}
        .badge-pending{background:rgba(255,171,0,.15);color:#ffab00;padding:2px 8px;border-radius:6px;font-size:.7rem;font-weight:700}
        .badge-approved{background:rgba(0,230,118,.15);color:#00e676;padding:2px 8px;border-radius:6px;font-size:.7rem;font-weight:700}
        .badge-rejected{background:rgba(255,23,68,.15);color:#ff1744;padding:2px 8px;border-radius:6px;font-size:.7rem;font-weight:700}
        .coin-3d{width:120px;height:120px;perspective:600px;margin:0 auto}.coin-inner{width:100%;height:100%;position:relative;transform-style:preserve-3d}
        .coin-face{position:absolute;width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:700;backface-visibility:hidden}
        .coin-heads{background:linear-gradient(135deg,#ffd740,#ffab00);color:#5d4037}.coin-tails{background:linear-gradient(135deg,#b0bec5,#78909c);color:#263238;transform:rotateY(180deg)}
        .fb-status{position:fixed;bottom:12px;left:12px;z-index:100;font-size:10px;padding:4px 10px;border-radius:6px;display:flex;align-items:center;gap:5px}
    </style>
</head>
<body class="bg-grid min-h-screen">
<div id="app"></div>
<div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2" style="max-width:360px"></div>
<div id="fb-status" class="fb-status glass"><div class="w-2 h-2 rounded-full bg-yellow-400 animate-pulse"></div><span class="text-slate-400">Conectando...</span></div>

<script>
// ================================================================
// FIREBASE CONFIG - SEM SENHAS, SEM DADOS SENSÍVEIS
// ================================================================
const FIREBASE_CONFIG = {
    apiKey: "AIzaSyAoTpeweJAuluIYFwLkVhiUVso8yxU8T_s",
    authDomain: "francisco-sites.firebaseapp.com",
    databaseURL: "https://francisco-sites-default-rtdb.firebaseio.com",
    projectId: "francisco-sites",
    storageBucket: "francisco-sites.firebasestorage.app",
    messagingSenderId: "386716924748",
    appId: "1:386716924748:web:fddb2d8dea0ef2d2416de9",
    measurementId: "G-327SVL1YM9"
};

// Inicializar Firebase
let fbApp, fbAuth, fbDB;
try {
    fbApp = firebase.apps.length ? firebase.app() : firebase.initializeApp(FIREBASE_CONFIG);
    fbAuth = firebase.auth();
    fbDB = firebase.database();
} catch(e) { console.error('Firebase init erro:', e); }

// ================================================================
// ESTADO - ISOLADO POR USUÁRIO, SEM ARRAY GLOBAL DE USERS
// ================================================================
const S = {
    view: 'loading', // loading | login | setup | lobby | game | wallet | admin
    game: null,
    // Dados do USUÁRIO ATUAL apenas (não carrega dados de outros)
    uid: null,
    userName: '',
    userEmail: '',
    balance: 0,
    isAdmin: false,
    // Settings
    settings: {
        pixLink: '', pixName: 'CoelhoBet',
        games: {
            crash:{enabled:true,houseEdge:5,name:'Coelhinho Crash',icon:'fa-rocket',color:'#00e676'},
            slots:{enabled:true,houseEdge:8,name:'Caça-Níqueis',icon:'fa-lemon',color:'#ffd740'},
            coinflip:{enabled:true,houseEdge:3,name:'Cara ou Coroa',icon:'fa-coins',color:'#29b6f6'},
            dice:{enabled:true,houseEdge:4,name:'Dados',icon:'fa-dice',color:'#ef5350'},
            wheel:{enabled:true,houseEdge:6,name:'Roleta da Fortuna',icon:'fa-circle-notch',color:'#ab47bc'}
        }
    },
    // Cache local (somente do usuário atual)
    transactions: [],
    pendingDeposits: [],
    pendingWithdrawals: [],
    // Admin cache (carregado sob demanda)
    allUsers: [],
    allDeposits: [],
    allWithdrawals: [],
    adminLoaded: false,
    // Crash
    crash: {phase:'waiting',multiplier:1,crashPoint:0,bet:0,cashedOut:false,frame:null,start:0,history:[]},
    // Cosméticos
    totalPaidOut: 4827391.55,
    fakeWinners: [],
    // Firebase listeners ativos
    _listeners: []
};

const NOMES = ['João P.','Maria S.','Carlos M.','Ana L.','Pedro R.','Lucia F.','Bruno G.','Fernanda C.','Rafael A.','Juliana V.','Diego T.','Camila N.','Thiago O.','Amanda H.','Lucas D.','Beatriz E.','Gabriel W.','Isabela K.'];
const EMOJIS = {crash:'🚀',slots:'🎰',coinflip:'🪙',dice:'🎲',wheel:'🎡'};

// ================================================================
// TOAST
// ================================================================
function showToast(msg, type='info') {
    const colors = {success:'border-l-4 border-green-500 bg-green-500/10',error:'border-l-4 border-red-500 bg-red-500/10',info:'border-l-4 border-blue-500 bg-blue-500/10',warning:'border-l-4 border-yellow-500 bg-yellow-500/10'};
    const icons = {success:'fa-check-circle text-green-400',error:'fa-times-circle text-red-400',info:'fa-info-circle text-blue-400',warning:'fa-exclamation-triangle text-yellow-400'};
    const el = document.createElement('div');
    el.className = `toast glass ${colors[type]||colors.info} rounded-lg px-4 py-3 flex items-center gap-3 text-sm`;
    el.innerHTML = `<i class="fas ${icons[type]||icons.info}"></i><span>${msg}</span>`;
    document.getElementById('toast-container').appendChild(el);
    setTimeout(() => { el.classList.add('removing'); setTimeout(() => el.remove(), 300); }, 3500);
}

// ================================================================
// FIREBASE AUTH - AUTENTICAÇÃO REAL
// ================================================================
// Registrar novo usuário
async function authRegister(name, email, password) {
    try {
        const cred = await fbAuth.createUserWithEmailAndPassword(email, password);
        const uid = cred.user.uid;
        // Criar perfil no banco
        await fbDB.ref(`users/${uid}`).set({
            name: name,
            email: email,
            balance: 1000, // Bônus de boas-vindas
            createdAt: Date.now()
        });
        // Registrar transação de bônus
        await fbDB.ref(`transactions/${uid}`).push({
            type: 'bonus', amount: 1000, game: 'Sistema', detail: 'Bônus de boas-vindas', timestamp: Date.now()
        });
        // Verificar se é o primeiro usuário (torna admin)
        const adminsSnap = await fbDB.ref('admins').once('value');
        if (!adminsSnap.exists() || !adminsSnap.val()) {
            await fbDB.ref(`admins/${uid}`).set(true);
            await fbDB.ref('setup/initialized').set(true);
            showToast('Primeiro usuário! Conta criada como Administrador.', 'success');
        } else {
            showToast(`Conta criada! R$ 1.000 de bônus!`, 'success');
        }
        return { ok: true };
    } catch(e) {
        return { ok: false, error: authError(e.code) };
    }
}

// Login
async function authLogin(email, password) {
    try {
        await fbAuth.signInWithEmailAndPassword(email, password);
        return { ok: true };
    } catch(e) {
        return { ok: false, error: authError(e.code) };
    }
}

// Logout
async function authLogout() {
    detachListeners();
    S.uid = null; S.userName = ''; S.userEmail = ''; S.balance = 0; S.isAdmin = false;
    S.view = 'login'; S.adminLoaded = false;
    await fbAuth.signOut();
    showToast('Você saiu', 'info');
    render();
}

// Traduzir erros do Firebase Auth
function authError(code) {
    const map = {
        'auth/email-already-in-use': 'E-mail já cadastrado',
        'auth/invalid-email': 'E-mail inválido',
        'auth/weak-password': 'Senha muito fraca (mínimo 6 caracteres)',
        'auth/user-not-found': 'E-mail não encontrado',
        'auth/wrong-password': 'Senha incorreta',
        'auth/invalid-credential': 'E-mail ou senha incorretos',
        'auth/too-many-requests': 'Muitas tentativas. Aguarde um momento.',
        'auth/network-request-failed': 'Erro de conexão'
    };
    return map[code] || 'Erro: ' + code;
}

// ================================================================
// FIREBASE DATA - OPERAÇÕES SEGURAS
// ================================================================

// Carregar dados do usuário atual
async function loadUserData(uid) {
    const snap = await fbDB.ref(`users/${uid}`).once('value');
    const data = snap.val();
    if (data) {
        S.userName = data.name || '';
        S.userEmail = data.email || '';
        S.balance = data.balance || 0;
    }
}

// Verificar se é admin
async function checkAdmin(uid) {
    const snap = await fbDB.ref(`admins/${uid}`).once('value');
    S.isAdmin = snap.val() === true;
}

// Atualizar saldo no Firebase (write validated por Security Rules)
async function updateBalance(delta) {
    const newBal = Math.max(0, S.balance + delta);
    S.balance = newBal; // Atualização otimista local
    try {
        await fbDB.ref(`users/${S.uid}/balance`).set(newBal);
    } catch(e) {
        // Reverter se falhar (Security Rules bloquearam)
        const snap = await fbDB.ref(`users/${S.uid}/balance`).once('value');
        S.balance = snap.val() || 0;
        showToast('Operação bloqueada pelas regras de segurança', 'error');
        render();
    }
}

// Registrar transação
async function addTx(type, amount, game, detail) {
    const tx = { type, amount, game, detail, timestamp: Date.now() };
    S.transactions.unshift(tx);
    try { await fbDB.ref(`transactions/${S.uid}`).push(tx); } catch(e) { console.error('addTx:', e); }
}

// Anexar listeners em tempo real
function attachListeners() {
    detachListeners();
    if (!S.uid) return;

    // Listener: saldo do usuário atual
    const bRef = fbDB.ref(`users/${S.uid}/balance`);
    bRef.on('value', snap => {
        const v = snap.val();
        if (v !== null && typeof v === 'number') {
            S.balance = v;
            updateBalanceDisplay();
        }
    });
    S._listeners.push({ ref: bRef, event: 'value' });

    // Listener: transações do usuário
    const tRef = fbDB.ref(`transactions/${S.uid}`).orderByChild('timestamp').limitToLast(30);
    tRef.on('value', snap => {
        const data = snap.val();
        S.transactions = data ? Object.values(data).sort((a,b) => b.timestamp - a.timestamp) : [];
    });
    S._listeners.push({ ref: tRef, event: 'value' });

    // Listener: settings
    const sRef = fbDB.ref('adminSettings');
    sRef.on('value', snap => {
        const d = snap.val();
        if (d) {
            if (d.games) S.settings.games = d.games;
            if (d.pixLink !== undefined) S.settings.pixLink = d.pixLink;
            if (d.pixName !== undefined) S.settings.pixName = d.pixName;
        }
    });
    S._listeners.push({ ref: sRef, event: 'value' });

    // Listener: totalPago
    const tpRef = fbDB.ref('totalPaidOut');
    tpRef.on('value', snap => {
        const v = snap.val();
        if (v !== null && typeof v === 'number') S.totalPaidOut = v;
    });
    S._listeners.push({ ref: tpRef, event: 'value' });

    // Se admin, anexar listeners admin
    if (S.isAdmin) attachAdminListeners();
}

function attachAdminListeners() {
    // Depósitos
    const dRef = fbDB.ref('pendingDeposits');
    dRef.on('value', snap => {
        const d = snap.val();
        S.allDeposits = d ? Object.entries(d).map(([id,v])=>({...v,id})) : [];
        S.pendingDeposits = S.allDeposits;
    });
    S._listeners.push({ ref: dRef, event: 'value' });

    // Saques
    const wRef = fbDB.ref('pendingWithdrawals');
    wRef.on('value', snap => {
        const d = snap.val();
        S.allWithdrawals = d ? Object.entries(d).map(([id,v])=>({...v,id})) : [];
        S.pendingWithdrawals = S.allWithdrawals;
    });
    S._listeners.push({ ref: wRef, event: 'value' });
}

// Carregar todos os usuários (apenas admin, sob demanda)
async function loadAllUsers() {
    if (!S.isAdmin) return;
    const snap = await fbDB.ref('users').once('value');
    const d = snap.val();
    S.allUsers = d ? Object.entries(d).map(([uid,v])=>({...v,uid})) : [];
    S.adminLoaded = true;
}

// Remover listeners
function detachListeners() {
    S._listeners.forEach(l => { try { l.ref.off(l.event); } catch(e){} });
    S._listeners = [];
}

function updateBalanceDisplay() {
    const el = document.getElementById('bal-display');
    if (el) el.textContent = fmt(S.balance);
}

// ================================================================
// UTILITÁRIOS
// ================================================================
function fmt(v) { return parseFloat(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtCount(v) { return parseFloat(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function generateCrashPoint(he) { const e=he/100,r=Math.random(); if(r<e)return 1; return Math.max(1.01,Math.floor((0.99/(1-r))*100)/100); }

// Feed de ganhadores (cosmético, não sensível)
function genFakeWinners() {
    const games = Object.keys(S.settings.games);
    for (let i=0;i<30;i++) {
        const g=games[Math.floor(Math.random()*games.length)];
        const nome=NOMES[Math.floor(Math.random()*NOMES.length)];
        const mult=[1.5,2,2.5,3,4,5,8,10,15,20][Math.floor(Math.random()*10)];
        const bet=[5,10,20,25,50,100,200][Math.floor(Math.random()*7)];
        S.fakeWinners.push({game:g,name:nome,amount:bet*mult,mult:mult.toFixed(2),time:Date.now()-Math.random()*3600000});
    }
    S.fakeWinners.sort((a,b)=>b.time-a.time);
}
setInterval(()=>{
    const games=Object.keys(S.settings.games).filter(k=>S.settings.games[k].enabled);
    if(!games.length)return;
    const g=games[Math.floor(Math.random()*games.length)];
    const nome=NOMES[Math.floor(Math.random()*NOMES.length)];
    const mult=[1.5,2,3,5,8,10][Math.floor(Math.random()*6)];
    const bet=[5,10,20,50,100][Math.floor(Math.random()*5)];
    const win=bet*mult;
    S.fakeWinners.unshift({game:g,name:nome,amount:win,mult:mult.toFixed(2),time:Date.now()});
    if(S.fakeWinners.length>50)S.fakeWinners.pop();
    S.totalPaidOut+=win;
    if(fbDB)fbDB.ref('totalPaidOut').set(S.totalPaidOut);
    updateTotalDisplay();
},3000);
function updateTotalDisplay(){
    const el=document.getElementById('total-paid-counter');if(el)el.textContent='R$ '+fmtCount(S.totalPaidOut);
    const h=document.getElementById('total-paid-hero');if(h)h.textContent='R$ '+fmtCount(S.totalPaidOut);
}

// ================================================================
// RENDER PRINCIPAL
// ================================================================
function render() {
    const app = document.getElementById('app');
    switch(S.view) {
        case 'loading': app.innerHTML = renderLoading(); break;
        case 'login': app.innerHTML = renderLogin(); break;
        case 'lobby': app.innerHTML = renderLobby(); break;
        case 'game': app.innerHTML = renderGame(); break;
        case 'wallet': app.innerHTML = renderWallet(); break;
        case 'admin': app.innerHTML = renderAdmin(); break;
        default: app.innerHTML = renderLogin();
    }
}

function renderLoading() {
    return `<div class="min-h-screen flex items-center justify-center"><div class="text-center"><div class="text-6xl animate-bunny-hop mb-4">🐰</div><p class="text-slate-400">Carregando...</p></div></div>`;
}

// ================================================================
// LOGIN / REGISTRO (FIREBASE AUTH)
// ================================================================
let loginTab = 'login';
function renderLogin() {
    return `<div class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
        <div class="orb w-72 h-72 bg-green-500/20 top-10 -left-20" style="animation-delay:-2s"></div>
        <div class="orb w-96 h-96 bg-yellow-500/10 -bottom-20 right-10" style="animation-delay:-5s"></div>
        <div class="glass rounded-2xl p-8 w-full max-w-md animate-slideUp relative z-10">
            <div class="text-center mb-8">
                <div class="text-6xl mb-3 animate-bunny-hop inline-block">🐰</div>
                <h1 class="font-display text-4xl text-brand-500 tracking-wide">CoelhoBet</h1>
                <p class="text-slate-400 mt-2 text-sm">A plataforma de jogos mais divertida</p>
            </div>
            <div class="flex mb-6 border-b border-slate-700">
                <button onclick="loginTab='login';render()" class="flex-1 pb-3 text-sm font-semibold ${loginTab==='login'?'tab-active':'tab-inactive'}">Entrar</button>
                <button onclick="loginTab='register';render()" class="flex-1 pb-3 text-sm font-semibold ${loginTab==='register'?'tab-active':'tab-inactive'}">Criar Conta</button>
            </div>
            ${loginTab==='register'?`
            <div class="space-y-4">

                    <div id="crash-status" class="text-sm mt-1 ${cs.phase==='running'?'text-brand-500':cs.phase==='crashed'?'text-red-400':'text-slate-400'}">${cs.phase==='waiting'?'Faça sua aposta!':cs.phase==='running'?'Subindo...':'CRASH!'}</div>

            </div>
            <div class="glass rounded-xl p-3"><label class="text-xs text-slate-400 block mb-1">Auto Cash Out</label><input id="crash-auto" type="number" class="input-field" value="2.00" min="1.01" step="0.1"></div>
            ${cs.phase==='waiting'?`<button onclick="startCrash()" class="btn-primary w-full py-3 text-base"><i class="fas fa-rocket mr-2"></i>Apostar e Iniciar</button>`:''}
            ${cs.phase==='running'&&!cs.cashedOut?`<button onclick="crashCashout()" class="btn-primary w-full py-3 text-base animate-pulse"><i class="fas fa-hand-paper mr-2"></i>Cash Out</button>`:''}
            ${cs.phase==='crashed'?`<button onclick="S.crash.phase='waiting';render()" class="btn-primary w-full py-3 text-base">Nova Rodada</button>`:''}
        </div></div>`;
}
function startCrash() {
    const bet=parseFloat(document.getElementById('crash-bet')?.value||10),autoCash=parseFloat(document.getElementById('crash-auto')?.value||0);
    if(S.balance<bet)return showToast('Saldo insuficiente!','error');if(bet<1)return showToast('Mínimo: 1','warning');
    updateBalance(-bet);addTx('bet',-bet,'Crash',`Aposta ${fmt(bet)}`);
    const he=S.settings.games.crash.houseEdge;
    S.crash={phase:'running',multiplier:1,crashPoint:generateCrashPoint(he),bet,cashedOut:false,autoCash,frame:null,start:performance.now(),history:S.crash.history||[]};
    render();animateCrash();
}
function crashCashout() {
    const cs=S.crash;if(cs.phase!=='running'||cs.cashedOut)return;
    cs.cashedOut=true;const win=cs.bet*cs.multiplier;
    updateBalance(win);addTx('win',win,'Crash',`Cash out ${cs.multiplier.toFixed(2)}x`);
    S.totalPaidOut+=win;if(fbDB)fbDB.ref('totalPaidOut').set(S.totalPaidOut);
    showToast(`Ganhou ${fmt(win)}! (${cs.multiplier.toFixed(2)}x)`,'success');render();
}
function animateCrash() {
    const cs=S.crash;if(cs.phase!=='running')return;
    const elapsed=(performance.now()-cs.start)/1000;
    cs.multiplier=Math.pow(Math.E,elapsed*.08);
    if(cs.autoCash&&cs.multiplier>=cs.autoCash&&!cs.cashedOut){cs.multiplier=cs.autoCash;crashCashout();return}
    if(cs.multiplier>=cs.crashPoint){cs.multiplier=cs.crashPoint;cs.phase='crashed';cs.history.push(parseFloat(cs.crashPoint.toFixed(2)));if(cs.history.length>20)cs.history.shift();render();drawCrashCanvas();return}
    drawCrashCanvas();cs.frame=requestAnimationFrame(animateCrash);
}
function stopCrash(){if(S.crash.frame)cancelAnimationFrame(S.crash.frame);S.crash.phase='waiting'}
function drawCrashCanvas(){
    const canvas=document.getElementById('crash-canvas');if(!canvas)return;
    const ctx=canvas.getContext('2d'),rect=canvas.parentElement.getBoundingClientRect();
    canvas.width=rect.width-32;canvas.height=260;const w=canvas.width,h=canvas.height,cs=S.crash;
    ctx.clearRect(0,0,w,h);ctx.strokeStyle='rgba(255,255,255,.03)';ctx.lineWidth=1;
    for(let i=0;i<5;i++){const y=h*.1+h*.8*i/4;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}
    const maxM=Math.max(cs.multiplier,2),padX=50,padTop=30,padBot=20,gW=w-padX-10,gH=h-padTop-padBot;
    const maxT=Math.max(Math.log(cs.multiplier)/.08,.01);
    ctx.beginPath();ctx.strokeStyle=cs.phase==='crashed'&&!cs.cashedOut?'#ff1744':'#00e676';ctx.lineWidth=3;ctx.shadowColor=ctx.strokeStyle;ctx.shadowBlur=10;
    for(let i=0;i<=100;i++){const t=maxT*i/100,m=Math.pow(Math.E,t*.08);if(m>cs.multiplier)break;const x=padX+(t/maxT)*gW,y=h-padBot-((m-1)/(maxM-1))*gH;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)}
    ctx.stroke();ctx.shadowBlur=0;
    const lx=padX+gW,ly=h-padBot-((cs.multiplier-1)/(maxM-1))*gH;ctx.font='24px serif';ctx.fillText('🐰',lx-12,ly+8);
    const me=document.getElementById('crash-mult'),se=document.getElementById('crash-status');
    if(me){me.textContent=cs.multiplier.toFixed(2)+'x';me.className=`font-display text-5xl ${cs.phase==='crashed'?'text-red-500':cs.cashedOut?'text-green-400':'text-white'}`}
    if(se){se.textContent=cs.phase==='waiting'?'Faça sua aposta!':cs.phase==='running'?'Subindo...':'CRASH!';se.className=`text-sm mt-1 ${cs.phase==='running'?'text-brand-500':cs.phase==='crashed'?'text-red-400':'text-slate-400'}`}
}

function playSlots(){
    const bet=parseFloat(document.getElementById('slots-bet')?.value||10);
    if(S.balance<bet)return showToast('Saldo insuficiente!','error');
    updateBalance(-bet);addTx('bet',-bet,'Slots',`Aposta ${fmt(bet)}`);
    const sym=['🍒','🍋','🔔','💎','7️⃣','🍀','⭐'],he=S.settings.games.slots.houseEdge;
    let res=[0,1,2].map(()=>sym[Math.floor(Math.random()*sym.length)]);
    if(Math.random()<he/100){if(res[0]===res[1]&&res[1]===res[2])res[2]=sym[(sym.indexOf(res[2])+1)%sym.length]}
    for(let i=0;i<3;i++){const el=document.getElementById(`slot-reel-${i}`);if(el){let sp=10+i*5;let iv=setInterval(()=>{el.textContent=sym[Math.floor(Math.random()*sym.length)];sp--;if(sp<=0){clearInterval(iv);el.textContent=res[i]}},60+i*20)}}
    setTimeout(()=>{
        let pay=0,msg='';
        if(res[0]===res[1]&&res[1]===res[2]){if(res[0]==='7️⃣'){pay=bet*100;msg='JACKPOT 100x!'}else if(res[0]==='💎'){pay=bet*50;msg='DIAMANTE 50x!'}else{pay=bet*10;msg='3 iguais 10x!'}}
        else if(res[0]===res[1]||res[1]===res[2]||res[0]===res[2]){pay=bet*2;msg='2 iguais 2x!'}else{msg='Sem sorte...'}
        if(pay>0){updateBalance(pay);addTx('win',pay,'Slots',msg);S.fakeWinners.unshift({game:'slots',name:S.userName,amount:pay,mult:(pay/bet).toFixed(2),time:Date.now()});S.totalPaidOut+=pay;if(fbDB)fbDB.ref('totalPaidOut').set(S.totalPaidOut);showToast(`Ganhou ${fmt(pay)}! ${msg}`,'success')}else showToast(msg,'info');
        const r=document.getElementById('slots-result');if(r)r.innerHTML=`<span class="${pay>0?'text-green-400':'text-red-400'}">${msg}</span>`;render();
    },1200);
}

function playCoinflip(choice){
    const bet=parseFloat(document.getElementById('coin-bet')?.value||10);
    if(S.balance<bet)return showToast('Saldo insuficiente!','error');
    updateBalance(-bet);addTx('bet',-bet,'Coin Flip',`Aposta ${choice==='heads'?'Cara':'Coroa'}`);
    const he=S.settings.games.coinflip.houseEdge;
    const result=Math.random()<(0.5-he/200)?(choice==='heads'?'tails':'heads'):choice;

    setTimeout(()=>{

        if(won){updateBalance(pay);addTx('win',pay,'Coin Flip',`Ganhou ${choice==='heads'?'Cara':'Coroa'}`);S.fakeWinners.unshift({game:'coinflip',name:S.userName,amount:pay,mult:'1.95',time:Date.now()});S.totalPaidOut+=pay;if(fbDB)fbDB.ref('totalPaidOut').set(S.totalPaidOut);showToast(`Ganhou ${fmt(pay)}!`,'success')}

    },1600);
}

// --------- ROLETA ---------
function renderWheelGame(){
    return `<div class="text-center">
        <div class="relative inline-block mb-6"><div class="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-2 z-10 text-2xl text-yellow-400">▼</div><canvas id="wheel-canvas" width="280" height="280"></canvas></div>
        <div class="glass rounded-xl p-4 inline-block mb-4"><label class="text-xs text-slate-400 block mb-2">Aposta</label><input id="wheel-bet" type="number" class="input-field w-40 text-center" value="10" min="1"></div><br>
        <button onclick="playWheel()" class="btn-primary text-lg px-12 py-4"><i class="fas fa-sync-alt mr-2"></i>GIRAR</button>
        <div id="wheel-result" class="mt-4 text-lg font-bold"></div></div>`;
}
const WSEGS=[{l:'0.5x',v:.5,c:'#ef5350'},{l:'1.5x',v:1.5,c:'#42a5f5'},{l:'2x',v:2,c:'#66bb6a'},{l:'0.2x',v:.2,c:'#ff7043'},{l:'3x',v:3,c:'#ab47bc'},{l:'0.5x',v:.5,c:'#ef5350'},{l:'5x',v:5,c:'#ffd740'},{l:'1x',v:1,c:'#26c6da'}];
function drawWheel(rot){
    const cv=document.getElementById('wheel-canvas');if(!cv)return;const ctx=cv.getContext('2d'),cx=140,cy=140,r=130;
    const rad=(rot*Math.PI)/180,segA=Math.PI*2/WSEGS.length;
    ctx.clearRect(0,0,280,280);
    WSEGS.forEach((s,i)=>{const sa=i*segA+rad-Math.PI/2,ea=sa+segA;ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,sa,ea);ctx.closePath();ctx.fillStyle=s.c;ctx.fill();ctx.strokeStyle='#0b0f19';ctx.lineWidth=2;ctx.stroke();
    const ma=(sa+ea)/2;ctx.save();ctx.translate(cx+Math.cos(ma)*r*.65,cy+Math.sin(ma)*r*.65);ctx.rotate(ma+Math.PI/2);ctx.fillStyle='#fff';ctx.font='bold 12px DM Sans';ctx.textAlign='center';ctx.fillText(s.l,0,0);ctx.restore()});
    ctx.beginPath();ctx.arc(cx,cy,18,0,Math.PI*2);ctx.fillStyle='#1a2332';ctx.fill();ctx.strokeStyle='#2a3a52';ctx.lineWidth=3;ctx.stroke();
}
function playWheel(){
    const bet=parseFloat(document.getElementById('wheel-bet')?.value||10);
    if(S.balance<bet)return showToast('Saldo insuficiente!','error');
    updateBalance(-bet);addTx('bet',-bet,'Roleta',`Aposta ${fmt(bet)}`);
    const he=S.settings.games.wheel.houseEdge;let si;
    if(Math.random()<he/100){const low=WSEGS.map((s,i)=>s.v<1?i:-1).filter(i=>i>=0);si=low[Math.floor(Math.random()*low.length)]}else{si=Math.floor(Math.random()*WSEGS.length)}
    const seg=WSEGS[si],segA=360/WSEGS.length,target=360-(si*segA+segA/2),totalSpin=1800+target,dur=4000,start=performance.now();
    function anim(now){const p=Math.min((now-start)/dur,1),ease=1-Math.pow(1-p,3),cur=ease*totalSpin;drawWheel(cur);if(p<1)requestAnimationFrame(anim);else{
        const pay=bet*seg.v;
        if(pay>0){updateBalance(pay);if(seg.v>=1){addTx('win',pay,'Roleta',seg.l);S.fakeWinners.unshift({game:'wheel',name:S.userName,amount:pay,mult:seg.v.toFixed(2),time:Date.now()});S.totalPaidOut+=pay;if(fbDB)fbDB.ref('totalPaidOut').set(S.totalPaidOut)}}
        else addTx('loss',-(bet-pay),'Roleta',seg.l);
        if(seg.v>=1)showToast(`Ganhou ${fmt(pay)}! (${seg.l})`,'success');else showToast(`Deu ${seg.l}! Perdeu.`,'error');
        const r=document.getElementById('wheel-result');if(r)r.innerHTML=`<span class="${seg.v>=1?'text-green-400':'text-red-400'}">${seg.l} - ${seg.v>=1?'Ganhou!':'Perdeu!'}</span>`;render();
    }}requestAnimationFrame(anim);
}

    showToast('Saque recusado, saldo devolvido','warning');render();
    }catch(e){showToast('Erro: '+e.message,'error')}
}

// ================================================================

// ================================================================
genFakeWinners();

// Firebase Auth state observer - detecta login/logout automaticamente
fbAuth.onAuthStateChanged(async (user) => {
    if (user) {
        // Usuário logado - carregar dados
        S.uid = user.uid;
        S.userEmail = user.email || '';
        await loadUserData(user.uid);
        await checkAdmin(user.uid);
        S.view = 'lobby';
        attachListeners();
        render();
    } else {
        // Não logado - mostrar login
        S.uid = null; S.balance = 0; S.isAdmin = false;
        S.view = 'login';
        render();
    }
});

// Status do Firebase
if(fbDB){
    fbDB.ref('.info/connected').on('value', snap => {
        const c = snap.val();
        const el = document.getElementById('fb-status');
        if(el) el.innerHTML = c
            ? '<div class="w-2 h-2 rounded-full bg-green-400"></div><span class="text-green-400">Online</span>'
            : '<div class="w-2 h-2 rounded-full bg-red-400 animate-pulse"></div><span class="text-red-400">Offline</span>';
    });
}

// Canvas observer
const observer = new MutationObserver(() => {
    if(document.getElementById('crash-canvas'))setTimeout(()=>drawCrashCanvas(),50);
    if(document.getElementById('wheel-canvas'))setTimeout(()=>drawWheel(0),50);
});
observer.observe(document.getElementById('app'),{childList:true,subtree:true});

// Atalho Enter
document.addEventListener('keydown', e => {
    if(e.key==='Enter' && S.view==='login'){
        loginTab==='login' ? doLogin() : doRegister();
    }
});

// Limpar ao sair da página
window.addEventListener('beforeunload', () => { detachListeners(); });
</script>
